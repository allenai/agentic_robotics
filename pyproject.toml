[project]
name = "agentic-robotics"
version = "0.1.0"
description = "An MCP-orchestrated agentic loop over black-box robot skills, with per-domain adapters."

readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11" # Isaac Sim 5.1 pins Python 3.11: https://pypi.org/project/isaacsim/5.1.0.0/

dependencies = [
        "mcp[cli]==2.3.0",
        "openai==2.53.0",
        "requests==2.34.2",
        "pillow==13.0.0",
        "click==8.4.2",
        "ImageIO==2.37.4",
        "numpy==2.4.6",          # Latest version of NumPy that supports Python >=3.11
        "scipy==1.17.1",         # Latest version of SciPy that supports Python >=3.11
        "aiohttp==3.14.5"
]

[project.scripts]
agentic-robotics = "agentic_robotics.adapters.toyblocks.cli:main"
agentic-robotics-suite = "agentic_robotics.adapters.toyblocks.drivers.evaluate_suite:main"
agentic-robotics-rao-suite = "agentic_robotics.adapters.toyblocks.drivers.rao_suite:main"
agentic-robotics-planbench = "agentic_robotics.adapters.toyblocks.drivers.planbench_run:main"
agentic-robotics-planbench-domain = "agentic_robotics.adapters.toyblocks.drivers.planbench_domain:main"
agentic-robotics-spell-build = "agentic_robotics.adapters.toyblocks.drivers.search_spell_build:main"
agentic-robotics-spell-summary = "agentic_robotics.adapters.toyblocks.drivers.search_spell_summary:main"
agentic-robotics-spell-env = "agentic_robotics.adapters.toyblocks.drivers.search_spell_env:main"
agentic-robotics-spell-check = "agentic_robotics.adapters.toyblocks.drivers.spelling_check:main"

[project.optional-dependencies]
dev = ["ruff==0.16.2", "pytest==9.1.1"]
toyblocks = ["pyarrow==25.0.0", "PyYAML==6.0.3", "gymnasium==1.3.0"]
# The Claude Code model host (`agentic-robotics episode --model-host claude-code`): the SDK bundles the
# CLI it drives, so the pin fixes the CLI version too.
claudecode = ["claude-agent-sdk==0.2.174"]


[tool.ruff]
line-length = 100
extend-exclude = ["data"]  # saved task packages carry generated env.py files

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
        "F",   # Pyflakes
        "E",   # pycodestyle (errors)
        "W",   # pycodestyle (warnings)
        "DOC", # pydoclint
        "I",   # isort
        "UP",  # pyupgrade
        "RUF", # Ruff-specific rules
        "ANN", # flake8-annotations
        "B",   # flake8-bugbear
        "C4",  # flake8-comprehensions
        "SIM", # flake8-simplify
        "TC",  # flake8-type-checking
        "ICN", # flake8-import-conventions
]
unfixable = ["F401"] # Don't delete unused imports

# src/ takes the full ruleset above. The probes and helpers under examples/ and scripts/ take a
# relaxed one, where only real defects get fixed: line length and annotations were the bulk of
# their findings, and E402 is the deliberate Isaac-before-imports order.
# `*args: Any, **kwargs: Any` on a function that only forwards them is as precise as the
# forwarding allows; ANN401 still applies to every named parameter and return.
[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E501", "ANN", "E402"]
# The drivers keep the relaxed set until they are annotated.
"src/agentic_robotics/adapters/toyblocks/drivers/**" = ["E501", "ANN", "E402"]
"scripts/**" = ["E501", "ANN", "E402"]
# Tool docstrings served to the model verbatim: their lines are never rewrapped.
"src/agentic_robotics/adapters/toyblocks/leap/**/*_agent.py" = ["E501", "W293"]
"tests/**" = ["E501", "ANN", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
